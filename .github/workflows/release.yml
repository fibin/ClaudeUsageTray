name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The release version is <Version> in ClaudeUsageTray.csproj.
      # A push to main whose version has no release yet publishes one (and creates tag v<Version>).
      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$proj = Get-Content ClaudeUsageTray.csproj
          $v = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          if (-not $v) { throw "No <Version> in ClaudeUsageTray.csproj" }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $isMain = ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') -or ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch')
          "release=$(if ($isMain -and -not $exists) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, release exists: $exists"

      - name: Publish (self-contained, no .NET required)
        run: >
          dotnet publish ClaudeUsageTray.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o out/self-contained

      - name: Publish (framework-dependent, needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish ClaudeUsageTray.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o out/framework-dependent

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/self-contained/ClaudeUsageTray.exe dist/ClaudeUsageTray-win-x64.exe
          Copy-Item out/framework-dependent/ClaudeUsageTray.exe dist/ClaudeUsageTray-win-x64-small.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageTray-win-x64
          path: dist/*.exe

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
